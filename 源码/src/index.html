<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d14">
<title>数字炸弹</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="top" id="topBar">
    <div class="hud-turn" id="turnChip" hidden>
      <span class="hud-turn-label">轮到</span>
      <span class="hud-turn-name" id="turnText">玩家 1</span>
    </div>
    <div class="hud-mid">
      <div id="rangeText">1 – 100</div>
      <div id="leftText">100 个数字</div>
    </div>
    <div class="hud-count">已猜<b id="tryCount">0</b></div>

    <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

    <button class="icon-btn" id="muteBtn" title="声音" aria-label="声音" aria-expanded="false" aria-controls="soundPop">
      <svg id="soundOnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path class="snd-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path class="snd-wave2" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        <line class="snd-slash" x1="3" y1="3" x2="21" y2="21"></line>
      </svg>
    </button>

    <!-- 点小喇叭：三条音轨（总音量 / 音效 / 语音） -->
    <div class="pop sound-pop" id="soundPop" hidden>
      <div class="trk">
        <div class="trk-head"><span>总音量</span><b id="volMasterVal">50%</b></div>
        <input class="vol-range" id="volMaster" type="range" min="0" max="100" step="1" value="50" aria-label="总音量">
      </div>
      <div class="trk">
        <div class="trk-head"><span>音效</span><b id="volSfxVal">50%</b></div>
        <input class="vol-range" id="volSfx" type="range" min="0" max="100" step="1" value="50" aria-label="音效音量">
      </div>
      <div class="trk">
        <div class="trk-head"><span>语音</span><b id="volVoiceVal">50%</b></div>
        <input class="vol-range" id="volVoice" type="range" min="0" max="100" step="1" value="50" aria-label="语音音量">
      </div>
      <button class="ghost-btn snd-all" id="muteAllBtn" type="button">全部禁止</button>
    </div>

    <button class="icon-btn" id="restartBtn" title="重开" aria-label="重开">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      </svg>
    </button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>
</div>

<!-- 设置 -->
<div class="overlay" id="setupOverlay">
  <div class="card">
    <!-- 玩法选择：数字炸弹 / 转盘 -->
    <div class="mode-switch" id="modeSwitch">
      <button class="mode-btn active" type="button" data-game="bomb">数字炸弹</button>
      <button class="mode-btn" type="button" data-game="wheel">转盘</button>
    </div>

    <div class="card-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <h1 id="gameTitle">数字炸弹</h1>
    </div>
    <p class="sub" id="gameSub">猜错的数字会消失 · 踩中炸弹者受罚</p>

    <div id="commonPanel">
    <!-- 一行三胶囊：两种玩法共用「人数」，炸弹/范围只有数字炸弹才显示 -->
    <div class="chip-row" id="chipRow">
      <button class="chip" id="modeChip" type="button" aria-expanded="false" aria-controls="modeOpts">
        <span class="chip-k">炸弹</span>
        <span class="chip-v">
          <b id="modeChipVal">随机生成</b>
          <svg class="chip-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>
      <button class="chip" id="rangeChip" type="button" aria-expanded="false" aria-controls="rangeOpts">
        <span class="chip-k">范围</span>
        <span class="chip-v">
          <b id="rangeChipVal">1 ~ 100</b>
          <svg class="chip-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>
      <button class="chip" id="playersChip" type="button" aria-expanded="false" aria-controls="playerOpts">
        <span class="chip-k">人数</span>
        <span class="chip-v">
          <b id="playersChipVal">4 人</b>
          <svg class="chip-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>
    </div>

    <div class="pop" id="playerOpts" hidden>
      <div class="pop-grid">
        <button class="opt" data-players="1">1 人</button>
        <button class="opt" data-players="2">2 人</button>
        <button class="opt" data-players="3">3 人</button>
        <button class="opt active" data-players="4">4 人</button>
        <button class="opt" data-players="6">6 人</button>
        <button class="opt" data-players="8">8 人</button>
      </div>
      <!-- 玩家名字：留空就自动叫「玩家 N」，填过的名字下次自动带出来 -->
      <div class="name-block">
        <button class="ocr-btn" id="ocrBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
            <line x1="7" y1="12" x2="17" y2="12"></line>
          </svg>
          自动识别
        </button>
        <p class="ocr-btn-tip" id="ocrBtnTip" hidden></p>
        <div class="name-head">
          <span>玩家名字</span>
          <span class="name-hint">留空 = 玩家 N</span>
        </div>
        <div class="name-rows" id="nameRows"></div>
        <div class="name-pool" id="namePool" hidden></div>
      </div>
    </div>

    </div><!-- /#commonPanel -->

    <div id="bombPanel">
    <div class="pop" id="modeOpts" hidden>
      <button class="seg-btn active" data-mode="random">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
          <line x1="4" y1="4" x2="9" y2="9"></line>
        </svg>
        随机生成
      </button>
      <button class="seg-btn" data-mode="custom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        自定义
      </button>
    </div>

    <div class="pop" id="rangeOpts" hidden>
      <button class="opt" data-max="30">1 ~ 30</button>
      <button class="opt" data-max="50">1 ~ 50</button>
      <button class="opt active" data-max="100">1 ~ 100</button>
    </div>

    <!-- 只在「自定义」模式下出现 -->
    <div class="custom-row" id="customRow" hidden>
      <input id="bombInput" type="text" inputmode="numeric" maxlength="3" pattern="[0-9]*" autocomplete="off" placeholder="1 ~ 100" disabled>
      <span class="eye-mask" id="eyeMask" aria-hidden="true"></span>
      <button class="eye-btn" id="eyeBtn" type="button" title="显示 / 隐藏数字" aria-label="显示或隐藏数字">
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <path d="M6.61 6.61A18.5 18.5 0 0 0 2 12s3 8 10 8a9.12 9.12 0 0 0 5.39-1.61"></path>
          <line x1="2" y1="2" x2="22" y2="22"></line>
        </svg>
        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8-10-8-10-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
    </div><!-- /#bombPanel -->

    <!-- 转盘玩法：把惩罚画在圆盘上，点中心开转，停下显示抽中的惩罚 -->
    <div id="wheelPanel" hidden>
      <!-- 还没选过人数时先拦一下：选完人数（可顺便填名字）再出转盘 -->
      <div class="wheel-gate" id="wheelGate" hidden>
        <div class="wg-people" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <p class="wg-title">先选玩家人数</p>
        <p class="wg-hint">点上面的「人数」选人数、填名字，然后点下面的「确认」就出转盘</p>
      </div>

      <div id="wheelBody">
      <div class="wheel-wrap">
        <svg id="wheelSvg" viewBox="0 0 320 344" role="img" aria-label="惩罚转盘">
          <circle class="wheel-bg" cx="160" cy="184" r="150"></circle>
          <g id="wheelRot"></g>
          <polygon class="wheel-ptr" points="160,56 143,6 177,6"></polygon>
        </svg>
        <button class="wheel-spin-btn" id="wheelSpinBtn" type="button" aria-label="开始转动">开始</button>
      </div>

      <!-- 扇区数：下拉选，选项浮在圆盘上方，不把卡片撑高 -->
      <div class="wheel-modes" id="wheelModes">
        <button class="chip" id="sectorChip" type="button" aria-expanded="false" aria-controls="sectorOpts">
          <span class="chip-k">扇区</span>
          <span class="chip-v">
            <b id="sectorChipVal">24</b>
            <svg class="chip-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </button>
        <div class="pop pop-float" id="sectorOpts" hidden>
          <button class="opt" data-sectors="12">12 个</button>
          <button class="opt active" data-sectors="24">24 个</button>
          <button class="opt" data-sectors="48">48 个</button>
          <button class="opt" data-sectors="all">全部</button>
        </div>
      </div>

      <p class="wheel-meta" id="wheelMeta"></p>
      <div class="wheel-result" id="wheelResult">
        <span class="wr-who" id="wheelWho" hidden></span>
        <span class="wr-text" id="wheelPunish">点中间的开始按钮开转</span>
      </div>
      </div><!-- /#wheelBody -->
    </div>

    <div class="primary-row" id="actionRow">
      <button class="primary" id="startBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        开始游戏
      </button>
      <button class="primary" id="confirmPlayersBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        确认
      </button>
    </div>
  </div>
</div>

<!-- 结束 -->
<div class="overlay" id="boomOverlay" hidden>
  <div class="card boom-card">
    <div class="boom-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"></path>
        <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>
    <h2>炸弹是 <em id="boomNum">42</em></h2>
    <p>你一共猜了 <b id="boomTries">0</b> 次</p>
    <p id="boomPlayer" class="boom-player" hidden></p>
    <p id="boomComment" class="boom-comment"></p>
    <div class="punish-badge">
      <span class="punish-badge-tag">随机惩罚</span>
      <span class="punish-badge-text" id="boomPunish">深蹲 20 个</span>
    </div>
    <button class="primary" id="againBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      </svg>
      再来一局
    </button>
  </div>
</div>

<!-- 设置（全局：惩罚内容 + 朗读） -->
<div class="overlay" id="punishOverlay" hidden>
  <div class="card punish-card">
    <div class="card-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <h1>设置</h1>
    </div>
    <p class="sub">惩罚内容 · 朗读</p>

    <label>惩罚列表</label>
    <div class="punish-list" id="punishList"></div>

    <div class="punish-add">
      <input id="punishInput" type="text" maxlength="14" placeholder="如：深蹲 20 个" autocomplete="off">
      <button class="add-btn" id="punishAddBtn" aria-label="添加惩罚">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
    <p class="punish-tip" id="punishTip"></p>

    <!-- 朗读开关在右上角小喇叭里，这里只留声音/语速 -->
    <div class="set-row" id="voiceRateRow">
      <button class="chip chip-mini" id="voiceChip" type="button" aria-expanded="false" aria-controls="voiceOpts">
        <span class="chip-k">声音</span>
        <span class="chip-v">
          <b id="voiceChipVal">慧慧</b>
          <svg class="chip-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>
      <button class="chip chip-mini" id="rateChip" type="button" aria-expanded="false" aria-controls="rateOpts">
        <span class="chip-k">语速</span>
        <span class="chip-v">
          <b id="rateChipVal">慢</b>
          <svg class="chip-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>
      <div class="pop" id="voiceOpts" hidden></div>
      <div class="pop" id="rateOpts" hidden>
        <button class="opt active" data-rate="0.85">慢</button>
        <button class="opt" data-rate="1.05">正常</button>
        <button class="opt" data-rate="1.3">快</button>
      </div>
    </div>

    <div class="punish-foot">
      <button class="ghost-btn" id="punishResetBtn">恢复默认</button>
      <button class="primary slim" id="punishCloseBtn">完成</button>
    </div>
  </div>
</div>

<!-- 再来一局 -->
<div class="overlay" id="againOverlay" hidden>
  <div class="card again-card">
    <div class="card-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      </svg>
      <h1>再来一局</h1>
    </div>
    <p class="sub">还是这几个人、这个范围，直接开下一局</p>

    <label>炸弹数字</label>
    <div class="seg" id="againMode">
      <button class="seg-btn active" data-mode="random">随机</button>
      <button class="seg-btn" data-mode="custom">自定义</button>
    </div>

    <div class="custom-row" id="againCustomRow" hidden>
      <input id="againInput" type="text" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="1 ~ 100">
      <span class="eye-mask" id="againEyeMask" aria-hidden="true"></span>
      <button class="eye-btn" id="againEyeBtn" type="button" title="显示 / 隐藏数字" aria-label="显示或隐藏数字">
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <path d="M6.61 6.61A18.5 18.5 0 0 0 2 12s3 8 10 8a9.12 9.12 0 0 0 5.39-1.61"></path>
          <line x1="2" y1="2" x2="22" y2="22"></line>
        </svg>
        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8-10-8-10-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
    <p class="punish-tip" id="againTip"></p>

    <div class="primary-row">
      <button class="primary" id="againStartBtn">开始</button>
      <button class="ghost-btn" id="againBackBtn">回到设置</button>
    </div>
  </div>
</div>

<!-- 屏幕框选（识别名字用） -->
<div class="pick-overlay" id="pickOverlay" hidden>
  <canvas id="pickCanvas"></canvas>
  <canvas id="pickMask" class="pick-mask-canvas"></canvas>
  <div class="pick-box" id="pickBox" hidden></div>
  <div class="pick-bar" id="pickBar">
    <button class="pick-mode active" type="button" data-pickmode="rect">框选</button>
    <button class="pick-mode" type="button" data-pickmode="brush">画笔</button>
  </div>
  <div class="pick-tip" id="pickTip">按住鼠标左键框住要识别的名字区域（Esc 取消）</div>
  <div class="pick-actions" id="pickActions" hidden>
    <button class="ghost-btn" id="pickCancelBtn">取消</button>
    <button class="primary slim" id="pickOkBtn">识别这一块</button>
  </div>
</div>

<!-- 识别结果确认 -->
<div class="overlay" id="ocrOverlay" hidden>
  <div class="card ocr-card">
    <div class="card-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
        <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
        <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
        <line x1="7" y1="12" x2="17" y2="12"></line>
      </svg>
      <h1>识别到的名字</h1>
    </div>
    <p class="sub">点一下去掉不想要的，确认后按顺序填进玩家 1、2、3…</p>
    <div class="ocr-list" id="ocrList"></div>
    <p class="punish-tip" id="ocrTip"></p>
    <div class="punish-foot">
      <button class="ghost-btn" id="ocrCancelBtn">取消</button>
      <button class="primary slim" id="ocrOkBtn">填入</button>
    </div>
  </div>
</div>

<!-- 踩雷音效（合成音作为兜底） -->
<audio id="boomSfx" src="sfx/boom.mp3" preload="auto"></audio>

<script src="js/audio.js"></script>
<script src="js/speech.js"></script>
<script src="js/punishments.js"></script>
<script src="js/names.js"></script>
<script src="js/wheel.js"></script>
<script src="js/ocr.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
